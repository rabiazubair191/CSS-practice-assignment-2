<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Practice</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <h1>Keyboard Design!</h1>

    <div class="container">


        <table>
            <tr class="table-row-1">
                <td class="td tilde-key">~</td>
                <td class="td">1</td>
                <td class="td">2</td>
                <td class="td">3</td>
                <td class="td">4</td>
                <td class="td">5</td>
                <td class="td">6</td>
                <td class="td">7</td>
                <td class="td">8</td>
                <td class="td">9</td>
                <td class="td">0</td>
                <td class="td">-</td>
                <td class="td">=</td>
                <td style=" box-shadow: 2px 4px 10px red;" class="td">Backspace</td>
            </tr>

            <tr class="table-row-2">
                <td class="td">Tab</td>
                <td class="td">Q</td>
                <td class="td">W</td>
                <td class="td">E</td>
                <td class="td">R</td>
                <td class="td">T</td>
                <td class="td">Y</td>
                <td class="td">U</td>
                <td style=" box-shadow: 2px 4px 10px red;" class="td">I</td>
                <td class="td">O</td>
                <td class="td">P</td>
                <td class="td">[</td>
                <td class="td">]</td>
                <td class="td slash-key">\</td>
            </tr>

            <tr class="table-row-3">
                <td class="td capslock-key">Caps lock</td>
                <td class="td">A</td>
                <td class="td">S</td>
                <td class="td">D</td>
                <td class="td">F</td>
                <td class="td">G</td>
                <td class="td">H</td>
                <td class="td">J</td>
                <td class="td">K</td>
                <td class="td">L</td>
                <td class="td">;</td>
                <td class="td">'</td>
                <td colspan="2" class="td enter-key">Enter</td>
            </tr>

            <tr class="table-row-4">
                <td class="td shift-key">Shift</td>
                <td class="td">Z</td>
                <td class="td">X</td>
                <td class="td">C</td>
                <td class="td">V</td>
                <td class="td">B</td>
                <td class="td">N</td>
                <td class="td">M</td>
                <td class="td">,</td>
                <td class="td">.</td>
                <td class="td">/</td>
                <td colspan="3" class="td shift-key">Shift</td>
            </tr>

            <tr class="table-row-5">
                <td class="td">Ctrl</td>
                <td class="td">Win</td>
                <td class="td">alt</td>
                <td colspan="8" class="td space-key">Space</td>
                <td class="td">alt</td>
                <td class="td">Win</td>
                <td class="td">Ctrl</td>
            </tr>
        </table>

    </div>

</body>

</html>
